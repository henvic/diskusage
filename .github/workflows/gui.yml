name: macOS app

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The branches below must be a subset of the branches above
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:

    # The app's "Build diskusage CLI" phase compiles the Go module into the
    # app bundle, so the build needs Go too.
    - name: Set up Go 1.x
      uses: actions/setup-go@v7
      with:
        go-version: "1.27.x"

    - name: Check out code
      uses: actions/checkout@v7

    # The app icon is an Icon Composer document, which needs Xcode 26 or later.
    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build
      run: |
        xcodebuild -project gui/DiskUsage.xcodeproj -scheme DiskUsage \
          -configuration Release -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          CODE_SIGNING_ALLOWED=NO build
